name: 스토리시드 릴리스 (자동 업데이트)

# 태그(v2.0.0 등)를 push하면 실행됩니다.
#   git tag v2.0.0 && git push origin v2.0.0
# tauri-action이 mac/windows 설치본과 함께 자동 업데이트용 latest.json(서명 포함)을
# GitHub Release에 올려줍니다. 앱은 이 latest.json을 보고 새 버전을 감지합니다.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest
            args: "--bundles nsis"
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: 의존성 설치
        run: npm install

      - name: 앱 아이콘 생성
        run: npx tauri icon app-icon.png

      - name: 빌드 + 릴리스 + latest.json 생성
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 아래 두 개는 저장소 Settings → Secrets에 등록해야 합니다(자동 업데이트 서명).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "스토리시드 ${{ github.ref_name }}"
          releaseBody: |
            - 바인더에서 문서를 드래그로 옮길 때 순서가 기억되지 않던 버그 수정
            - 붙여넣기 서식(유지/제거) 위젯에서 서식을 전환하면 글자 수가 중복되던 버그 근본 수정
            - 대용량 텍스트 붙여넣기 속도 개선
            - 모바일 미리보기: 문단간격이 반영되지 않던 버그, 페이지식 보기가 장문 텍스트에서 멈추던 버그 수정
            - 모바일 미리보기 폰 크기를 자유롭게 조절하고, 위치도 드래그로 옮길 수 있도록 개선
            - 삽입 메뉴 '문자표' 카테고리 확장
            - 기타 각종 버그 수정
          releaseDraft: false
          prerelease: false
          # 릴리스 파일명을 영문으로 고정 — 한글 파일명이 GitHub 업로드 과정에서
          # 임의로 바뀌면서 tauri-action이 설치 파일과 .sig 파일을 짝짓지 못해
          # latest.json 생성을 건너뛰던 문제(v0에서 발생)를 막기 위함.
          releaseAssetNamePattern: "storyseed_[version]_[arch][setup][ext]"
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}