name: 스토리시드 릴리스 (자동 업데이트)

# 태그(v2.0.0 등)를 push하면 실행됩니다.
#   git tag v2.0.0 && git push origin v2.0.0
# tauri-action이 mac/windows 설치본과 함께 자동 업데이트용 latest.json(서명 포함)을
# GitHub Release에 올려줍니다. 앱은 이 latest.json을 보고 새 버전을 감지합니다.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest
            args: "--bundles nsis"
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: 의존성 설치
        run: npm install

      - name: 앱 아이콘 생성
        run: npx tauri icon app-icon.png

      - name: 빌드 + 릴리스 + latest.json 생성
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 아래 두 개는 저장소 Settings → Secrets에 등록해야 합니다(자동 업데이트 서명).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "스토리시드 ${{ github.ref_name }}"
          releaseBody: |
            - 내보내기 파일명 입력칸 개선
            - 붙여넣기 위젯: ESC로 닫기, '다시 묻지 않음' 옵션 추가
            - 작품 이름 바꾸기·숨기기·완전 삭제 기능 추가
            - 문서 탭을 드래그해서 순서 변경 및 분할 화면 이동
            - 환경설정에 '모든 설정 기본값으로' 버튼 추가
            - 집중 모드 색상을 자유롭게 커스터마이징
            - 테마 색상 10종 추가
            - 창 최소 폭·높이 수정
            - 텍스트 양쪽 정렬 방식 수정(글자 단위 줄바꿈 가능)
            - 기타 각종 버그 수정
          releaseDraft: false
          prerelease: false
          # 릴리스 파일명을 영문으로 고정 — 한글 파일명이 GitHub 업로드 과정에서
          # 임의로 바뀌면서 tauri-action이 설치 파일과 .sig 파일을 짝짓지 못해
          # latest.json 생성을 건너뛰던 문제(v0에서 발생)를 막기 위함.
          releaseAssetNamePattern: "storyseed_[version]_[arch][setup][ext]"
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}